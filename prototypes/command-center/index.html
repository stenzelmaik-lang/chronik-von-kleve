<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChroniPlay · Regie</title><style>
:root{color-scheme:dark;--gold:#dab978;--muted:#9aabb5;--line:#33414b}*{box-sizing:border-box}body{margin:0;background:#0a1119;color:#efece4;font:15px/1.6 system-ui}button,a,select,textarea{font:inherit}button,a{cursor:pointer}button,select{border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:#16222e;color:inherit}button:hover,button.active{border-color:var(--gold);background:#283340}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--gold)}header{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{letter-spacing:5px;color:var(--gold);font-weight:600}small,.muted{color:var(--muted)}a{color:var(--gold)}main{display:grid;grid-template-columns:240px minmax(300px,1fr) 310px;gap:24px;padding:28px;max-width:1800px;margin:auto}aside,section{min-width:0}.panel{border:1px solid var(--line);border-radius:14px;background:#111c27;padding:22px;margin-bottom:20px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:clamp(34px,4vw,66px);max-width:700px;margin:25px 0}h2{font-size:26px}h3{font-size:22px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;color:var(--gold)}.scene{min-height:380px;padding:44px;border:1px solid #60717b;border-radius:16px;background:radial-gradient(ellipse at top right,var(--scene),transparent 65%),linear-gradient(140deg,#162430,#090f17);display:flex;flex-direction:column;justify-content:flex-end}.scene p{font-size:19px;max-width:640px;color:#c4ced1}.scene-button{display:block;width:100%;text-align:left;margin:10px 0}.secret{border-left:3px solid var(--gold)}textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#0c141d;color:inherit;padding:14px}.primary{background:var(--gold);color:#151b21;font-weight:600}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{padding:18px 0;border-bottom:1px solid var(--line)}.card:last-child{border:0}.pill{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--gold)}#status{min-height:28px;color:var(--gold)}.player main{grid-template-columns:minmax(300px,1fr) 340px;max-width:1300px}.player .scene{min-height:480px}@media(max-width:1100px){main{grid-template-columns:190px minmax(300px,1fr)}main>aside:last-child{grid-column:1/-1}}@media(max-width:700px){header{padding:18px;align-items:flex-start;flex-direction:column}main,.player main{grid-template-columns:1fr;padding:16px}.scene{padding:26px;min-height:320px}main>aside:last-child{grid-column:auto}}
</style><header><div><div class="brand">CHRONIPLAY</div><small>Regie · isolierter Prototyp / ausschließlich Beispieldaten</small></div><div class="row" id="links"></div></header><main id="app"></main><script>
const key='__DEMO_KEY__',isGM=location.pathname==='/',identity=new URLSearchParams(location.search).get('id')||'a';let state,lastRevision=-1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.body.classList.toggle('player',!isGM);document.getElementById('links').innerHTML=isGM?'<a href="/player?id=a" target="_blank" rel="noopener">Spieler A öffnen ↗</a><a href="/player?id=b" target="_blank" rel="noopener">Spieler B öffnen ↗</a>':'<span class="pill">Spieler '+esc(identity.toUpperCase())+' · Demoidentität</span>';
async function load(){try{const r=await fetch(isGM?'/api/gm':'/api/player?id='+encodeURIComponent(identity),{headers:isGM?{'x-demo-key':key}:{}});if(!r.ok)throw Error('Ansicht nicht verfügbar');state=await r.json();if(state.revision!==lastRevision){lastRevision=state.revision;render();}}catch(e){document.getElementById('app').textContent=e.message;}}
async function command(body){const r=await fetch('/api/gm',{method:'POST',headers:{'Content-Type':'application/json','x-demo-key':key},body:JSON.stringify({...body,revision:state.revision})});const result=await r.json();if(!r.ok){document.getElementById('status').textContent=result.error||'Änderung fehlgeschlagen';return;}state=result;lastRevision=state.revision;render();document.getElementById('status').textContent='Gespeichert · '+new Date().toLocaleTimeString('de-DE');}
function scene(s){return '<div class="scene" style="--scene:'+esc(s.color)+'"><span class="eyebrow">Aktive Szene · '+esc(state.phase)+'</span><h1>'+esc(s.name)+'</h1><p>'+esc(s.description)+'</p><span class="pill">Synthetische Demonstration · kein Kanon</span></div>';}
function render(){if(!isGM){document.getElementById('app').innerHTML='<section>'+scene(state.scene)+'</section><aside class="panel"><span class="eyebrow">Dein Wissen</span><h2>Freigegebenes Material</h2>'+ (state.handouts.length?state.handouts.map(h=>'<article class="card"><h3>'+esc(h.title)+'</h3><p>'+esc(h.text)+'</p></article>').join(''):'<p class="muted">Noch kein Handout für dich freigegeben.</p>')+'<small>Aktualisiert automatisch alle zwei Sekunden. Private Regieinformationen werden nicht übertragen.</small></aside>';return;}
const active=state.scenes.find(s=>s.id===state.active);document.getElementById('app').innerHTML='<aside><div class="eyebrow">01 / Sitzung</div><h2>Die nächste Nacht</h2><label for="phase">Sitzungsphase</label><select id="phase">'+['Vorbereitung','Live','Nachbereitung'].map(p=>'<option '+(state.phase===p?'selected':'')+'>'+p+'</option>').join('')+'</select><h3>Szenen</h3>'+state.scenes.map(s=>'<button class="scene-button '+(s.id===state.active?'active':'')+'" data-scene="'+s.id+'">'+esc(s.name)+'</button>').join('')+'<p class="muted">Wechsle jederzeit die Szene. Freigaben bleiben gezielt steuerbar.</p><div class="panel"><span class="eyebrow">Regelsystem / V20</span><p>Charaktere und Würfel werden später an die vorhandenen ChroniPlay-Module angebunden.</p><small>Keine zweite Würfel- oder Charakterengine.</small></div></aside><section>'+scene(active)+'<div class="panel secret"><span class="eyebrow">Nur Spielleitung</span><h3>Regie dieses Schauplatzes</h3><p>'+esc(active.private)+'</p></div><div class="panel"><div class="row"><h3>Private Sitzungsnotizen</h3><span class="pill">Nur SL</span></div><label for="notes">Gedanken, Konsequenzen und offene Fäden</label><textarea id="notes">'+esc(state.notes)+'</textarea><div class="row"><button id="save" class="primary">Notizen speichern</button><span id="status" role="status" aria-live="polite">Gespeicherter Stand geladen</span></div></div></section><aside><div class="eyebrow">02 / Informationsregie</div><h2>Gezielt enthüllen</h2><p class="muted">Ein Handout erreicht nur die gewählte Demoidentität. Eine Gruppenfreigabe erreicht beide.</p><div class="panel">'+state.handouts.map(h=>'<article class="card"><h3>'+esc(h.title)+'</h3><p>'+esc(h.text)+'</p><label>Zielgruppe <select data-target="'+h.id+'"><option value="a">Spieler A</option><option value="b">Spieler B</option><option value="group">Gesamte Gruppe</option></select></label><div class="row"><button data-release="'+h.id+'">Freigeben</button><button data-revoke="'+h.id+'">Zurückziehen</button></div><small>Freigegeben: '+esc(h.targets.join(', ')||'niemand')+'</small></article>').join('')+'</div><div class="panel"><h3>Sitzungsverlauf</h3>'+state.events.slice(0,5).map(e=>'<p><small>'+esc(new Date(e.at).toLocaleTimeString('de-DE'))+'</small> · '+esc(({scene:'Szene gewechselt',notes:'Notizen gespeichert',phase:'Phase geändert',release:'Freigabe aktualisiert'})[e.action])+'</p>').join('')+'</div></aside>';
document.getElementById('phase').onchange=e=>command({action:'phase',value:e.target.value});document.getElementById('notes').oninput=()=>document.getElementById('status').textContent='Ungespeicherte Änderungen';document.getElementById('save').onclick=()=>command({action:'notes',value:document.getElementById('notes').value});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{if(document.getElementById('notes').value!==state.notes&&!confirm('Ungespeicherte Notizen verwerfen?'))return;command({action:'scene',value:b.dataset.scene});});for(const mode of ['release','revoke'])document.querySelectorAll('[data-'+mode+']').forEach(b=>b.onclick=()=>command({action:'release',id:b.dataset[mode],target:document.querySelector('[data-target="'+b.dataset[mode]+'"]').value,enabled:mode==='release'}));}
load();if(!isGM)setInterval(load,2000);
</script></html>
