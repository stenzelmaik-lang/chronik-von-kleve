name: Project CI and W10 checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Frozen install, types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck
      - name: ESLint (W10 and character state)
        shell: bash
        run: |
          files=(
            domain/w10.ts domain/w10-core.ts domain/w10-hybrid-draft.ts
            domain/w10-selection.ts domain/character-vitals.ts
            domain/character-specialties.ts domain/trait-ids.ts
            tests/w10-hybrid.test.mjs tests/w10-selection.test.mjs
            tests/character-vitals.test.mjs
            prototypes/spieltisch-2/w10-rules.test.mjs
            prototypes/spieltisch-2/shared-dice.test.mjs
          )
          if [[ -f domain/w10-c1-ordinary.ts ]]; then files+=(domain/w10-c1-ordinary.ts); fi
          if [[ -f tests/w10-c1-ordinary.test.mjs ]]; then files+=(tests/w10-c1-ordinary.test.mjs); fi
          ./node_modules/.bin/eslint "${files[@]}"
      - name: Unit and regression tests
        run: pnpm test
      - name: W10 core and character sheet tests (Linux)
        run: node --experimental-strip-types --test tests/w10-hybrid.test.mjs tests/w10-selection.test.mjs prototypes/spieltisch-2/w10-rules.test.mjs tests/character-vitals.test.mjs
      - name: C1 ordinary checks when present in the PR
        shell: bash
        run: |
          if [[ -f tests/w10-c1-ordinary.test.mjs ]]; then
            node --experimental-strip-types --test tests/w10-c1-ordinary.test.mjs
          else
            echo 'C1 test file is not part of this revision; W10 core and sheet tests ran above.'
          fi
      - name: Project build
        run: pnpm run build
      - name: W10 synthetic HTTP integration
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/test-local.mjs --w10-hybrid > "$RUNNER_TEMP/w10-hybrid.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 150); do
            if grep -q 'Isolated application ready:' "$RUNNER_TEMP/w10-hybrid.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/w10-hybrid.log"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/w10-hybrid.log"
            echo 'Synthetic W10 server did not become ready'
            exit 1
          fi
          CVK_TEST_URL=http://127.0.0.1:8878 pnpm run test:w10-hybrid-integration || {
            tail -n 100 "$RUNNER_TEMP/w10-hybrid.log"
            exit 1
          }
      - name: Project synthetic HTTP integration
        run: pnpm run test:integration:run

  shared-dice-windows:
    name: Shared Dice test (Windows path semantics)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Shared Dice regression
        run: node --experimental-strip-types --test prototypes/spieltisch-2/shared-dice.test.mjs
