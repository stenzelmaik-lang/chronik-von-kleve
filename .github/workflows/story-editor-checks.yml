name: Command Center – Story Editor checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/spielbereich/modules/story-workspace.*"
      - "app/spielbereich/modules/rich-text.*"
      - "domain/story-*.ts"
      - "tests/story-*.test.mjs"
      - ".github/workflows/story-editor-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (affected Story Editor files)
        # Existing prototype code outside this PR has unresolved global lint errors.
        run: ./node_modules/.bin/eslint app/spielbereich/modules/story-workspace.tsx tests/story-preparation.test.mjs
      - name: Unit and regression tests
        run: npm test
      - name: HTTP integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
