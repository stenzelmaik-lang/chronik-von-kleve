name: Command Center – Story Editor checks

on:
  push:
    branches:
      - ux/sl-story-session-first-20261028
  pull_request:
    paths:
      - "app/spielbereich/modules/story-workspace.*"
      - "app/spielbereich/modules/rich-text.*"
      - "domain/story-*.ts"
      - "tests/story-*.test.mjs"
      - ".github/workflows/story-editor-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Repair old lockfile in temporary runner workspace
        run: npm install --package-lock-only --include=dev --include=optional --no-audit --no-fund
      - name: Show lockfile repair for review
        run: git diff -- package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
