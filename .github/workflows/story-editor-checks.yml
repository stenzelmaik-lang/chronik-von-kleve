name: Command Center – Story Editor checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/spielbereich/modules/story-workspace.*"
      - "app/spielbereich/modules/preparation-guide.tsx"
      - "app/spielbereich/modules/session-overview.tsx"
      - "domain/preparation-guide.ts"
      - "app/spielbereich/modules/rich-text.*"
      - "domain/story-*.ts"
      - "tests/story-*.test.mjs"
      - "tests/story-browser-smoke.mjs"
      - "tests/preparation-guide-browser.mjs"
      - ".github/workflows/story-editor-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (affected Story Editor files)
        # Existing prototype code outside this PR has unresolved global lint errors.
        run: ./node_modules/.bin/eslint app/spielbereich/modules/story-workspace.tsx app/spielbereich/modules/preparation-guide.tsx app/spielbereich/modules/session-overview.tsx domain/preparation-guide.ts tests/story-preparation.test.mjs tests/preparation-guide-browser.mjs
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: HTTP integration tests
        run: npm run test:integration:run

  browser-smoke:
    name: Isolated SL browser journey (desktop, mobile, HTML)
    # Independent from typecheck/build job so the isolated UI check runs concurrently.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Prepare headless Chromium (test-runner only)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build isolated test worker
        run: npm run build
      - name: Run complete local SL browser journey
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/test-local.mjs --spieltisch-release > "$RUNNER_TEMP/story-workspace.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 150); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8820/api/members || true)" = "401" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/story-workspace.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/story-workspace.log"
            echo "Local fixture server did not become ready"
            exit 1
          fi
          CVK_TEST_URL=http://127.0.0.1:8820 node tests/story-browser-smoke.mjs || {
            tail -n 100 "$RUNNER_TEMP/story-workspace.log"
            exit 1
          }
          CVK_TEST_URL=http://127.0.0.1:8820 node --experimental-strip-types tests/preparation-guide-browser.mjs || {
            tail -n 100 "$RUNNER_TEMP/story-workspace.log"
            exit 1
          }
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-browser-smoke-screenshots
          path: |
            artifacts/story-browser-smoke/*.png
            artifacts/preparation-guide/*.png
          retention-days: 7
          if-no-files-found: ignore
